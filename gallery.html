<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - BermanFPV</title>
    <link rel="icon" type="image/png" href="img/logow.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/logow.png" alt="BermanFPV Logo" height="30" class="d-inline-block align-text-top">
                BermanFPV
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="gallery.html">Gallery</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Gallery Header -->
    <header class="bg-light py-5">
        <div class="container">
            <h1 class="text-center mb-4">FPV Drone Gallery</h1>
            <p class="lead text-center">Explore our collection of amazing FPV drone footage and images</p>
        </div>
    </header>

    <!-- Gallery Grid -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4">
                <!-- Image Grid -->
                <div class="col-md-4 col-6">
                    <a href="img/gallery1-placeholder.jpg" data-lightbox="drone-gallery"
                        data-title="Racing Drone Setup">
                        <img src="img/racequad.jpg" class="img-fluid gallery-img" alt="Racing Drone">
                    </a>
                </div>
                <div class="col-md-4 col-6">
                    <a href="img/gallery2-placeholder.jpg" data-lightbox="drone-gallery" data-title="Freestyle Flight">
                        <img src="img/freestylequad.jpg" class="img-fluid gallery-img" alt="Freestyle Drone">
                    </a>
                </div>
                <div class="col-md-4 col-6">
                    <a href="img/gallery3-placeholder.jpg" data-lightbox="drone-gallery" data-title="Cinematic Shot">
                        <img src="img/cinequadf.jpg" class="img-fluid gallery-img" alt="Cinematic Drone">
                    </a>
                </div>

                <!-- Video Section -->
                <div class="col-12 mt-5">
                    <h2 class="text-center mb-4">Featured Videos</h2>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="ratio ratio-16x9">
                                <iframe src="https://www.youtube.com/embed/YPNtouPtkJY" allowfullscreen></iframe>
                            </div>
                            <h5 class="mt-2">Epic Mountain Flight</h5>
                        </div>
                        <div class="col-md-6">
                            <div class="ratio ratio-16x9">
                                <iframe src="https://www.youtube.com/embed/I_PoQCq4O9k" allowfullscreen></iframe>
                            </div>
                            <h5 class="mt-2">Bando Freestyle</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>BermanFPV</h5>
                    <p>Your gateway to the exciting world of FPV drone flying.</p>
                </div>
                <div class="col-md-6">
                    <h5>Follow Us</h5>
                    <div class="social-links">
                        <a href="#" class="text-white me-3"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="text-white me-3"><i class="bi bi-instagram"></i></a>
                        <a href="#" class="text-white me-3"><i class="bi bi-youtube"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
    <script src="js/main.js"></script>
    <script type="module" src="js/firebase-auth.js"></script>
</body>

</html>
