<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - BermanFPV</title>
    <link rel="icon" type="image/png" href="img/logow.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/logow.png" alt="BermanFPV Logo" height="30" class="d-inline-block align-text-top">
                BermanFPV
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">Gallery</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Form Section -->
    <section class="py-5">
        <div class="container">
            <h1 class="text-center mb-5">Contact Us</h1>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <form class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">Your Message</label>
                            <textarea class="form-control" id="message" rows="5" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Your Experience Level</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="experience" id="beginner"
                                    value="beginner" required>
                                <label class="form-check-label" for="beginner">Beginner</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="experience" id="intermediate"
                                    value="intermediate">
                                <label class="form-check-label" for="intermediate">Intermediate</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="experience" id="advanced"
                                    value="advanced">
                                <label class="form-check-label" for="advanced">Advanced</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Interested In (Select all that apply)</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="racing" value="racing">
                                <label class="form-check-label" for="racing">Drone Racing</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="freestyle" value="freestyle">
                                <label class="form-check-label" for="freestyle">Freestyle Flying</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="filming" value="filming">
                                <label class="form-check-label" for="filming">Aerial Filming</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="preferred-drone" class="form-label">Preferred Drone Type</label>
                            <select class="form-select" id="preferred-drone" required>
                                <option value="">Choose...</option>
                                <option value="3inch">3 Inch Freestyle</option>
                                <option value="5inch">5 Inch Freestyle</option>
                                <option value="cinewhoop">Cinewhoop</option>
                                <option value="tinyhawk">Micro (Tinyhawk)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="country" class="form-label">Country</label>
                            <select class="form-select" id="country" required>
                                <option value="">Choose your country...</option>
                                <option value="us">United States</option>
                                <option value="uk">United Kingdom</option>
                                <option value="ca">Canada</option>
                                <option value="au">Australia</option>
                                <option value="de">Germany</option>
                                <option value="fr">France</option>
                                <option value="il">Israel</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>BermanFPV</h5>
                    <p>Your gateway to the exciting world of FPV drone flying.</p>
                </div>
                <div class="col-md-6">
                    <h5>Follow Us</h5>
                    <div class="social-links">
                        <a href="#" class="text-white me-3"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="text-white me-3"><i class="bi bi-instagram"></i></a>
                        <a href="#" class="text-white me-3"><i class="bi bi-youtube"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script type="module" src="js/firebase-auth.js"></script>
</body>

</html>
